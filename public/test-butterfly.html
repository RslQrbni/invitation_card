<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Butterfly Effect Test</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700&display=swap" rel="stylesheet">
  <style>
    body, html, #app {
      margin: 0;
      width: 100%;
      height: 100%;
    }

    #app {
      overflow: hidden;
      touch-action: pan-up;
      color: #ffffff;
      font-family: 'Montserrat', sans-serif;
      text-align: center;
      text-shadow: 0 0 5px #000000, 0 0 20px #000;
      user-select: none;
    }

    #app h1 {
      --fontSize: 50px;
      --lineHeight: 70px;
      width: auto;
      height: calc(2 * var(--lineHeight));
      line-height: var(--lineHeight);
      margin: calc(50vh - var(--lineHeight)) auto 0;
      font-size: var(--fontSize);
    }

    #app a {
      margin-top: 10px;
      display: inline-block;
      text-decoration: none;
      color: #fff;
    }

    #app canvas {
      display: block;
      position: fixed;
      z-index: -1;
      top: 0;
      left: 0;
      width: 100% !important;
      height: 100% !important;
    }

    @keyframes flap {
      0%, 20%, 80%, 100% {
        transform: scaleX(1) rotate(5deg);
      }
      50% {
        transform: scaleX(0.7) rotate(7deg);
      }
    }

    h1 {
      text-align: center;
      font-size: 2rem;
    }

    h1 span {
      display: inline-block;
      animation: flap 0.75s infinite ease-in-out;
    }

    #controls {
      position: fixed;
      top: 15px;
      left: 15px;
      z-index: 100;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .btn {
      background-color: rgba(0, 0, 0, 0.45);
      border: 1px solid rgba(255, 255, 255, 0.25);
      color: #ffffff;
      padding: 8px 14px;
      text-align: center;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 14px;
      cursor: pointer;
      border-radius: 6px;
      transition: all 0.25s ease;
      backdrop-filter: blur(8px);
    }

    .btn:hover {
      background-color: rgba(255, 255, 255, 0.25);
      color: #ffff00;
    }

    #fullscreenBtn {
      font-size: 16px;
    }
  </style>
</head>
<body>
  <div id="controls">
    <button class="btn" id="fullscreenBtn" onclick="toggleFullscreen()">⛶ Fullscreen</button>
    <a href="/" class="btn">← Back to Wedding Card</a>
  </div>

  <div id="app">
    <h1><span>🦋</span> Butterflies</h1>
  </div>

  <script type="module">
    import { butterfliesBackground } from 'https://unpkg.com/threejs-toys@0.0.8/build/threejs-toys.module.cdn.min.js';

    try {
      butterfliesBackground({
        el: document.getElementById('app'),
        eventsEl: document.body,
        gpgpuSize: 18,
        background: 0x88CEFF,
        material: 'phong',
        lights: [
          { type: 'ambient', params: [0xffffff, 0.5] },
          { type: 'directional', params: [0xffffff, 1], props: { position: [10, 0, 0] } }
        ],
        materialParams: { transparent: true, alphaTest: 0.5 },
        texture: '/butterflies.png',
        textureCount: 4,
        wingsScale: [2, 2, 2],
        wingsWidthSegments: 16,
        wingsHeightSegments: 16,
        wingsSpeed: 0.75,
        wingsDisplacementScale: 1.25,
        noiseCoordScale: 0.01,
        noiseTimeCoef: 0.0005,
        noiseIntensity: 0.0025,
        attractionRadius1: 100,
        attractionRadius2: 150,
        maxVelocity: 0.1
      });
    } catch (err) {
      console.error('Error initializing butterflies:', err);
    }

    window.toggleFullscreen = () => {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(() => {});
      } else {
        document.exitFullscreen().catch(() => {});
      }
    };
  </script>
</body>
</html>
